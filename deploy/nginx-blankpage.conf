# nginx config for the website Pi: serves the built website and forwards /api to the server Pi.
# Install it with the steps in deploy/README.md.
server {
    listen 80 default_server;
    listen [::]:80 default_server;

    root /var/www/blankpage/dist;
    index index.html;

    # The API lives on the server Pi. nginx looks this name up once when it starts,
    # so restart nginx if the server Pi gets a new IP address.
    location /api/ {
        proxy_pass http://todopi.local:5000;
        proxy_set_header Host $host;
        client_max_body_size 20m;   # file uploads
        proxy_read_timeout 120s;    # AI requests can take a while
    }

    # The site is one page: send paths like /ambient to index.html and let React handle them.
    location / {
        try_files $uri /index.html;
    }
}
